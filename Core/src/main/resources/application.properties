# JWT Configuration
app.jwt.secret=VGhpc0lzQVNlY3JldEtleUZvckpXVFRva2VuU2lnbmluZ1B1cnBvc2VzT25seUFuZE11c3RCZUF0TGVhc3QyNTZCaXRzTG9uZw==
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Server Configuration
server.port=8080

# Docker Compose - Disabled
spring.docker.compose.enabled=false

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/smarterp_core
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.smarterp.core=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=INFO
