apiVersion: v1
kind: Secret
metadata:
  name: core-db-secret
  namespace: erp-microservices
type: Opaque
data:
  POSTGRES_USER: bXl1c2Vy # "myuser" base64 encoded
  POSTGRES_PASSWORD: c2VjcmV0 # "secret" base64 encoded

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: core-db-pvc
  namespace: erp-microservices
spec:
  accessModes:
    - ReadWriteOnce # Suitable for a single database instance
  resources:
    requests:
      storage: 1Gi # Define a default storage size, can be adjusted
  storageClassName: standard # Or your preferred storage class

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: core-db-statefulset
  namespace: erp-microservices
spec:
  serviceName: "core-db-service"
  replicas: 1
  selector:
    matchLabels:
      app: core-db
  template:
    metadata:
      labels:
        app: core-db
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: postgres
          image: postgres:latest
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_DB
              value: "mydatabase"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: core-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: core-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: core-db-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates: # This will use the PVC defined above if storageClassName is the same or default
    - metadata:
        name: core-db-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
        storageClassName: standard # Ensure this matches your environment or the PVC above

---
apiVersion: v1
kind: Service
metadata:
  name: core-db-service
  namespace: erp-microservices
spec:
  ports:
    - port: 5432
      targetPort: postgresql
  selector:
    app: core-db
  type: ClusterIP # Expose internally
